name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: make test

      - name: Reproduce benchmark report + web fixtures
        run: |
          python -m rra.bench.report
          python scripts/export_web_data.py
          git diff --stat docs/benchmark-report.md web/app/data/ || true
